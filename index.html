  <style>
    /* ==========================================================================
       1. DIZAYN TIZIMI VA RANGLAR O'ZGARUVCHILARI (TUNGI VA YORUG' REJIM)
       ========================================================================== */
    :root {
      --bg-primary: #0b0d12;
      --bg-secondary: #151922;
      --bg-elevated: rgba(21, 25, 34, 0.72);
      --bg-glass: rgba(21, 25, 34, 0.62);
      --bg-input: rgba(11, 13, 18, 0.78);
      --bg-header-scroll: rgba(11, 13, 18, 0.82);

      --accent-orange: #f2a900;
      --accent-gold: #ffd24a;
      --accent-cyan: #00e5ff;
      --accent-green: #10b981;
      --accent-red: #ef4444;

      --text-primary: #f5f5f5;
      --text-secondary: #9aa3b2;
      --text-muted: #6c7689;
      --text-on-accent: #0b0d12;

      --border-gold: rgba(242, 169, 0, 0.24);
      --border-gold-strong: rgba(255, 210, 74, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.08);

      --shadow-card: 0 18px 40px -15px rgba(0, 0, 0, 0.75);
      --shadow-glow-gold: 0 0 28px rgba(242, 169, 0, 0.28);
      --shadow-glow-cyan: 0 0 24px rgba(0, 229, 255, 0.22);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;

      --font-display: 'Orbitron', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --header-height: 68px;
    }

    /* Yorug' rejim o'zgaruvchilari (ixtiyoriy tugma orqali yoqiladi) */
    html.light {
      --bg-primary: #f3f5f9;
      --bg-secondary: #ffffff;
      --bg-elevated: rgba(255, 255, 255, 0.88);
      --bg-glass: rgba(255, 255, 255, 0.82);
      --bg-input: #eef1f6;
      --bg-header-scroll: rgba(243, 245, 249, 0.88);

      --accent-orange: #d98e00;
      --accent-gold: #f2a900;
      --accent-cyan: #009bb3;

      --text-primary: #111520;
      --text-secondary: #4c566a;
      --text-muted: #6c7689;
      --text-on-accent: #0b0d12;

      --border-gold: rgba(217, 142, 0, 0.28);
      --border-gold-strong: rgba(217, 142, 0, 0.72);
      --border-subtle: rgba(17, 21, 32, 0.1);

      --shadow-card: 0 14px 34px -12px rgba(17, 21, 32, 0.12);
      --shadow-glow-gold: 0 8px 26px rgba(217, 142, 0, 0.22);
      --shadow-glow-cyan: 0 8px 22px rgba(0, 155, 179, 0.16);
    }

    /* ==========================================================================
       2. ASOSIY RESET VA BAZA STILLARI
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Desktopda maxsus kursor yoqilganda */
    @media (hover: hover) and (pointer: fine) {
      body.custom-cursor-active,
      body.custom-cursor-active a,
      body.custom-cursor-active button,
      body.custom-cursor-active input,
      body.custom-cursor-active textarea,
      body.custom-cursor-active [role="button"] {
        cursor: none !important;
      }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    input, textarea {
      font-family: inherit;
      color: inherit;
    }

    img, svg {
      display: block;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Fokus ko'rinishi (accessibility) */
    :focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
    }

    @media (min-width: 768px) {
      .container {
        padding-left: 28px;
        padding-right: 28px;
      }
    }

    /* ==========================================================================
       3. FON ZARRALARI VA HARAKATLANUVCHI GRADIENT BULUTLAR
       ========================================================================== */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .gradient-cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.16;
      will-change: transform;
      animation: cloudDrift 22s ease-in-out infinite alternate;
    }

    html.light .gradient-cloud {
      opacity: 0.12;
    }

    .cloud-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--accent-orange), transparent 70%);
      top: -120px;
      left: -120px;
    }

    .cloud-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-delay: -9s;
      animation-duration: 28s;
    }

    .cloud-3 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, var(--accent-gold), transparent 70%);
      top: 45%;
      left: 55%;
      opacity: 0.08;
      animation-delay: -5s;
      animation-duration: 25s;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
    }

    @keyframes cloudDrift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(45px, 30px, 0) scale(1.08); }
      100% { transform: translate3d(-30px, 50px, 0) scale(0.95); }
    }

    /* ==========================================================================
       4. YUKLASH EKRANI (LOADING OVERLAY — IKKIGA BO'LINIB OCHILISH)
       ========================================================================== */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-overlay.is-done {
      pointer-events: none;
    }

    .loader-half {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      background: #0b0d12;
      transition: transform 0.85s var(--ease-out-expo);
      will-change: transform;
    }

    .loader-half-top {
      top: 0;
      border-bottom: 1px solid rgba(242, 169, 0, 0.18);
    }

    .loader-half-bottom {
      bottom: 0;
      border-top: 1px solid rgba(242, 169, 0, 0.18);
    }

    .loader-overlay.is-splitting .loader-half-top {
      transform: translateY(-102%);
    }

    .loader-overlay.is-splitting .loader-half-bottom {
      transform: translateY(102%);
    }

    .loader-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .loader-overlay.is-splitting .loader-center {
      opacity: 0;
      transform: scale(0.92);
    }

    .loader-coin-stage {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 700px;
    }

    .loader-neon-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent-gold);
      border-right-color: var(--accent-orange);
      box-shadow: 0 0 26px rgba(242, 169, 0, 0.45), inset 0 0 16px rgba(255, 210, 74, 0.2);
      animation: ringSpin 1.4s linear infinite;
    }

    .loader-neon-ring-inner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 229, 255, 0.55);
      animation: ringSpinReverse 2.4s linear infinite;
    }

    .loader-coin-3d {
      width: 72px;
      height: 72px;
      transform-style: preserve-3d;
      animation: coinSpinY 1.6s linear infinite;
    }

    .loader-progress-wrap {
      width: min(280px, 78vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .loader-status-text {
      font-family: var(--font-display);
      font-size: 0.875rem;
      letter-spacing: 0.06em;
      color: var(--accent-gold);
      text-align: center;
    }

    .loader-bar-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(242, 169, 0, 0.25);
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold), var(--accent-cyan));
      box-shadow: 0 0 14px rgba(255, 210, 74, 0.65);
      transition: width 0.08s linear;
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes ringSpinReverse {
      to { transform: rotate(-360deg); }
    }

    @keyframes coinSpinY {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    /* ==========================================================================
       5. SCROLL PROGRESS CHIZIG'I VA MAXSUS KURSOR
       ========================================================================== */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      z-index: 1000;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold), var(--accent-cyan));
      box-shadow: 0 0 10px rgba(242, 169, 0, 0.6);
      pointer-events: none;
      transition: width 0.08s linear;
    }

    .cursor-dot,
    .cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.25s ease, width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform;
    }

    .cursor-dot {
      width: 8px;
      height: 8px;
      margin-left: -4px;
      margin-top: -4px;
      background: var(--accent-gold);
      box-shadow: 0 0 10px var(--accent-gold);
    }

    .cursor-ring {
      width: 34px;
      height: 34px;
      margin-left: -17px;
      margin-top: -17px;
      border: 1.5px solid rgba(255, 210, 74, 0.6);
    }

    .cursor-ring.is-hover {
      width: 48px;
      height: 48px;
      margin-left: -24px;
      margin-top: -24px;
      border-color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.08);
    }

    @media (hover: none), (pointer: coarse) {
      .cursor-dot, .cursor-ring {
        display: none !important;
      }
    }

    /* ==========================================================================
       6. HEADER VA NAVIGATSIYA (STICKY, BLUR, MOBIL DRAWER)
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 500;
      height: var(--header-height);
      display: flex;
      align-items: center;
      border-bottom: 1px solid transparent;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease, transform 0.7s var(--ease-out-expo), opacity 0.6s ease;
    }

    body.is-loading .site-header {
      transform: translateY(-100%);
      opacity: 0;
    }

    .site-header.is-scrolled {
      background: var(--bg-header-scroll);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom-color: var(--border-gold);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-accent {
      color: var(--accent-gold);
    }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 20px;
    }

    @media (min-width: 1024px) {
      .desktop-nav {
        display: flex;
      }
    }

    .nav-link {
      position: relative;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 8px 2px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text-primary);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.28s var(--ease-out-expo);
    }

    .nav-link.is-active {
      color: var(--accent-gold);
    }

    .nav-link.is-active::after {
      transform: scaleX(1);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Til almashtirish tugmasi (UZ / RU) */
    .lang-switch {
      display: inline-flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }

    .lang-btn {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 7px;
      color: var(--text-secondary);
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 28px;
      white-space: nowrap;
    }

    .lang-btn.is-active {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
      color: var(--text-on-accent);
    }

    /* Ikonka tugmalari (Rejim va Savat) */
    .icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
      color: var(--text-on-accent);
      font-size: 0.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(242, 169, 0, 0.55);
      transition: transform 0.2s ease;
    }

    .cart-badge.is-bouncing {
      animation: cartBounce 0.48s var(--ease-out-expo);
    }

    @keyframes cartBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.45); }
      70% { transform: scale(0.88); }
      100% { transform: scale(1); }
    }

    .hamburger-btn {
      display: inline-flex;
    }

    @media (min-width: 1024px) {
      .hamburger-btn {
        display: none;
      }
    }

    /* Mobil menyu (o'ng tomondan slide bo'lib chiqadi) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.7);
      backdrop-filter: blur(4px);
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-backdrop.is-open {
      opacity: 1;
      pointer-events: all;
    }

    .mobile-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 86vw);
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-gold);
      z-index: 850;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      transform: translateX(100%);
      transition: transform 0.38s var(--ease-out-expo);
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.55);
    }

    .mobile-drawer.is-open {
      transform: translateX(0);
    }

    .mobile-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .mobile-nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mobile-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-secondary);
      opacity: 0;
      transform: translateX(24px);
      transition: opacity 0.32s ease, transform 0.32s var(--ease-out-expo), background-color 0.2s ease, color 0.2s ease;
    }

    .mobile-drawer.is-open .mobile-nav-link {
      opacity: 1;
      transform: translateX(0);
    }

    .mobile-drawer.is-open .mobile-nav-link:nth-child(1) { transition-delay: 0.05s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(2) { transition-delay: 0.10s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(3) { transition-delay: 0.15s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(4) { transition-delay: 0.20s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(5) { transition-delay: 0.25s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(6) { transition-delay: 0.30s; }
    .mobile-drawer.is-open .mobile-nav-link:nth-child(7) { transition-delay: 0.35s; }

    .mobile-nav-link.is-active {
      background: rgba(242, 169, 0, 0.14);
      color: var(--accent-gold);
      border: 1px solid var(--border-gold);
    }

    /* ==========================================================================
       7. SAVAT YON PANELI (CART DRAWER)
       ========================================================================== */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 92vw);
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-gold);
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.38s var(--ease-out-expo);
      box-shadow: -24px 0 60px rgba(0, 0, 0, 0.6);
    }

    .cart-drawer.is-open {
      transform: translateX(0);
    }

    .cart-drawer-head {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cart-drawer-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .cart-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-empty {
      margin: auto;
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px solid var(--border-gold);
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cart-item-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent-gold);
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      background: var(--bg-secondary);
      transition: background-color 0.2s ease, transform 0.12s ease;
    }

    .qty-btn:hover {
      background: rgba(242, 169, 0, 0.2);
      color: var(--accent-gold);
    }

    .qty-btn:active {
      transform: scale(0.92);
    }

    .cart-drawer-foot {
      padding: 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-elevated);
    }

    .cart-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
    }

    .cart-total-val {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent-gold);
    }

    /* ==========================================================================
       8. UMUMIY TUGMALAR, KARTALAR VA FORM ELEMENTLARI
       ========================================================================== */
    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      min-height: 46px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      transition: transform 0.16s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-gold) 100%);
      color: var(--text-on-accent);
      box-shadow: 0 8px 24px rgba(242, 169, 0, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 0 32px rgba(255, 210, 74, 0.55);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: var(--bg-glass);
      color: var(--text-primary);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(12px);
    }

    .btn-secondary:hover {
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
      transform: translateY(-1px);
    }

    .btn-pulse {
      animation: btnGlowPulse 2.4s ease-in-out infinite;
    }

    @keyframes btnGlowPulse {
      0%, 100% { box-shadow: 0 6px 22px rgba(242, 169, 0, 0.32); }
      50% { box-shadow: 0 0 36px rgba(255, 210, 74, 0.68), 0 0 12px rgba(0, 229, 255, 0.24); }
    }

    /* Ripple effekti */
    .ripple-span {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0);
      animation: rippleAnim 0.55s linear;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Glassmorphism karta */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    /* ==========================================================================
       9. SAHIFA KONTEYNERI VA SAHIFALAR ORASIDA O'TISH ANIMATSIYASI
       ========================================================================== */
    .main-stage {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - var(--header-height) - 220px);
      padding-bottom: 64px;
    }

    .page-view {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.24s ease, transform 0.28s var(--ease-out-expo);
    }

    .page-view.is-leaving {
      opacity: 0;
      transform: translateY(10px);
    }

    .page-view.is-entering {
      animation: pageEnter 0.38s var(--ease-out-expo) forwards;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scroll'da paydo bo'lish (IntersectionObserver) */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.6s var(--ease-out-expo), transform 0.65s var(--ease-out-expo);
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Section Sarlavhalari */
    .section-block {
      padding: 56px 0;
    }

    @media (min-width: 768px) {
      .section-block {
        padding: 72px 0;
      }
    }

    .section-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
      max-width: 680px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      font-weight: 800;
      line-height: 1.2;
      text-wrap: balance;
    }

    .section-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .gold-gradient-text {
      background: linear-gradient(120deg, var(--accent-orange), var(--accent-gold), #fff4c2, var(--accent-gold));
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: goldShine 4s linear infinite;
    }

    @keyframes goldShine {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    /* ==========================================================================
       10. HERO BO'LIMI VA KIRISH ANIMATSIYALARI
       ========================================================================== */
    .hero-section {
      position: relative;
      overflow: hidden;
      padding: 48px 0 64px;
      min-height: calc(100vh - var(--header-height) - 24px);
      display: flex;
      align-items: center;
    }

    .hero-grid {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .hero-grid {
        grid-template-columns: 1.15fr 0.85fr;
        gap: 48px;
      }
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .hero-kicker {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.6vw, 3.6rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .hero-word-wrap {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      margin-right: 0.24em;
    }

    .hero-word {
      display: inline-block;
      transform: translateY(115%);
      opacity: 0;
      transition: transform 0.65s var(--ease-out-expo), opacity 0.5s ease;
    }

    body.hero-ready .hero-word {
      transform: translateY(0);
      opacity: 1;
    }

    .hero-desc {
      color: var(--text-secondary);
      font-size: clamp(1rem, 1.4vw, 1.125rem);
      max-width: 56ch;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease 0.3s, transform 0.65s var(--ease-out-expo) 0.3s;
    }

    body.hero-ready .hero-desc {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease 0.45s, transform 0.65s var(--ease-out-expo) 0.45s;
    }

    body.hero-ready .hero-cta-row {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-stats-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 540px;
      margin-top: 16px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease 0.6s, transform 0.65s var(--ease-out-expo) 0.6s;
    }

    body.hero-ready .hero-stats-row {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-stat-num {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 2.2vw, 1.65rem);
      font-weight: 800;
      color: var(--accent-gold);
    }

    .hero-stat-label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Hero o'ng tomoni: 3D suzuvchi tangalar sahnasi */
    .hero-visual {
      position: relative;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    @media (min-width: 768px) {
      .hero-visual {
        height: 440px;
      }
    }

    .hero-vault-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242, 169, 0, 0.28), rgba(0, 229, 255, 0.08) 55%, transparent 72%);
      filter: blur(18px);
      animation: pulseOrb 4.5s ease-in-out infinite;
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .hero-orbital-ring {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 210, 74, 0.32);
      animation: ringSpin 24s linear infinite;
    }

    .hero-orbital-ring-2 {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.25);
      animation: ringSpinReverse 18s linear infinite;
    }

    .hero-main-coin {
      position: relative;
      z-index: 3;
      width: 170px;
      height: 170px;
      filter: drop-shadow(0 20px 35px rgba(242, 169, 0, 0.38));
      animation: coinFloatMain 4.8s ease-in-out infinite;
      will-change: transform;
    }

    .hero-mini-coin {
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0 12px 22px rgba(242, 169, 0, 0.28));
      will-change: transform;
    }

    .mini-coin-1 { width: 64px; height: 64px; top: 14%; left: 10%; animation: coinFloatAlt 5.4s ease-in-out infinite; }
    .mini-coin-2 { width: 52px; height: 52px; top: 18%; right: 8%; animation: coinFloatMain 6.2s ease-in-out infinite -1.5s; }
    .mini-coin-3 { width: 58px; height: 58px; bottom: 14%; left: 14%; animation: coinFloatMain 5.8s ease-in-out infinite -2.4s; }
    .mini-coin-4 { width: 46px; height: 46px; bottom: 18%; right: 12%; animation: coinFloatAlt 4.9s ease-in-out infinite -0.8s; }

    @keyframes coinFloatMain {
      0%, 100% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-18px) rotate(4deg); }
    }

    @keyframes coinFloatAlt {
      0%, 100% { transform: translateY(0px) rotate(6deg); }
      50% { transform: translateY(14px) rotate(-6deg); }
    }

    /* Hero ichidagi tushuvchi tangalar yomg'iri */
    .hero-coin-rain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .rain-coin {
      position: absolute;
      top: -50px;
      opacity: 0.22;
      animation: coinRainFall linear infinite;
      will-change: transform;
    }

    @keyframes coinRainFall {
      0% { transform: translateY(-60px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.28; }
      85% { opacity: 0.24; }
      100% { transform: translateY(620px) rotate(360deg); opacity: 0; }
    }

    /* ==========================================================================
       11. UC PAKET KARTALARI (3D TILT, SHIMMER BADGE, FLIP ANIMATSIYA)
       ========================================================================== */
    .packages-grid-home {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    @media (min-width: 640px) {
      .packages-grid-home {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .packages-grid-home {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* Do'kon gridi: mobilda 2 ustun, desktopda 3 ustun */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (min-width: 640px) {
      .shop-grid {
        gap: 20px;
      }
    }

    @media (min-width: 1024px) {
      .shop-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
    }

    .uc-card {
      position: relative;
      padding: 16px 14px;
      border-radius: 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-gold);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      transition: transform 0.25s var(--ease-out-expo), border-color 0.25s ease, box-shadow 0.25s ease;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .uc-card {
        padding: 26px 22px;
        gap: 16px;
      }
    }

    .uc-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      background: conic-gradient(from var(--border-angle, 0deg), transparent 55%, var(--accent-gold), var(--accent-cyan), transparent 95%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .uc-card:hover::before {
      opacity: 1;
      animation: rotateBorderAngle 2.8s linear infinite;
    }

    @property --border-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes rotateBorderAngle {
      to { --border-angle: 360deg; }
    }

    .uc-card:hover {
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
    }

    .uc-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #0b0d12;
      background: linear-gradient(110deg, var(--accent-orange) 20%, #fff2b2 50%, var(--accent-gold) 80%);
      background-size: 200% auto;
      animation: badgeShimmer 2.6s linear infinite;
      box-shadow: 0 4px 14px rgba(242, 169, 0, 0.4);
    }

    .uc-badge.is-mega {
      background: linear-gradient(110deg, var(--accent-cyan) 15%, #d6fbff 50%, var(--accent-gold) 85%);
      background-size: 200% auto;
    }

    @keyframes badgeShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .uc-coin-wrap {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s var(--ease-out-expo);
    }

    @media (min-width: 640px) {
      .uc-coin-wrap {
        width: 72px;
        height: 72px;
      }
    }

    .uc-card:hover .uc-coin-wrap {
      animation: coinWobble 0.65s ease;
    }

    @keyframes coinWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.08); }
      55% { transform: rotate(10deg) scale(1.1); }
      80% { transform: rotate(-4deg) scale(1.04); }
    }

    .uc-amount-main {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    @media (min-width: 640px) {
      .uc-amount-main {
        font-size: 1.55rem;
      }
    }

    .uc-bonus-line {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-cyan);
      min-height: 20px;
    }

    @media (min-width: 640px) {
      .uc-bonus-line {
        font-size: 0.85rem;
      }
    }

    .uc-total-line {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .uc-price-block {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .uc-price-val {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    @media (min-width: 640px) {
      .uc-price-val {
        font-size: 1.35rem;
      }
    }

    .uc-unit-price {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .uc-buy-btn {
      width: 100%;
      padding: 10px 12px;
      min-height: 42px;
      font-size: 0.82rem;
      border-radius: 12px;
    }

    @media (min-width: 640px) {
      .uc-buy-btn {
        padding: 12px 20px;
        min-height: 46px;
        font-size: 0.95rem;
      }
    }

    /* Saralash tugmalari paneli */
    .shop-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }

    .filter-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 5px;
      border-radius: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn.is-active {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
      color: var(--text-on-accent);
    }

    /* Savatga uchuvchi tanga */
    .flying-coin {
      position: fixed;
      z-index: 9500;
      width: 34px;
      height: 34px;
      pointer-events: none;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease;
      will-change: transform, opacity;
    }

    /* ==========================================================================
       12. NEGA AYNAN BIZ, FIKRLAR KARUSELI VA STATISTIKA BLOKI
       ========================================================================== */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .features-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .features-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .feature-card {
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.3s var(--ease-out-expo), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-8px);
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
    }

    .feature-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(242, 169, 0, 0.12);
      border: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      transition: transform 0.45s var(--ease-out-expo), background-color 0.3s ease;
    }

    .feature-card:hover .feature-icon-box {
      transform: rotate(360deg) scale(1.06);
      background: rgba(242, 169, 0, 0.22);
    }

    .feature-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .feature-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Fikrlar karuseli */
    .reviews-shell {
      position: relative;
      padding: 28px 24px;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .reviews-shell {
        padding: 36px 40px;
      }
    }

    .reviews-track {
      display: flex;
      transition: transform 0.55s var(--ease-out-expo);
      will-change: transform;
    }

    .review-slide {
      min-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .review-stars {
      display: inline-flex;
      gap: 4px;
      color: var(--accent-gold);
    }

    .review-quote {
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      line-height: 1.65;
      color: var(--text-primary);
      max-width: 72ch;
    }

    .review-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .review-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      color: #0b0d12;
      flex-shrink: 0;
    }

    .reviews-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .slider-dots {
      display: flex;
      gap: 8px;
    }

    .slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--border-subtle);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .slider-dot.is-active {
      width: 28px;
      background: var(--accent-gold);
    }

    /* Statistika bloki */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (min-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
    }

    .stat-card {
      padding: 24px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 900;
      color: var(--accent-gold);
    }

    .stat-label {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       13. BUYURTMA SAHIFASI (#/order) — STEPPER, VALIDATSIYA, KONFETTI
       ========================================================================== */
    .order-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (min-width: 960px) {
      .order-layout {
        grid-template-columns: 1.45fr 0.9fr;
      }
    }

    .stepper-header {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .step-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .step-pill.is-active {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(242, 169, 0, 0.1);
    }

    .step-pill.is-done {
      border-color: rgba(16, 185, 129, 0.5);
      color: var(--accent-green);
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .step-pill.is-active .step-num {
      background: var(--accent-gold);
      color: #0b0d12;
    }

    .step-pill.is-done .step-num {
      background: var(--accent-green);
      color: #0b0d12;
    }

    .order-panel {
      padding: 24px;
      overflow: hidden;
    }

    .step-stage {
      animation: stepSlideIn 0.34s var(--ease-out-expo);
    }

    @keyframes stepSlideIn {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .order-pkg-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (min-width: 640px) {
      .order-pkg-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .order-pkg-option {
      padding: 14px 12px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .order-pkg-option:hover {
      border-color: var(--border-gold-strong);
    }

    .order-pkg-option.is-selected {
      border-color: var(--accent-gold);
      background: rgba(242, 169, 0, 0.12);
      box-shadow: var(--shadow-glow-gold);
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.98rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(242, 169, 0, 0.18);
    }

    .form-input.is-valid {
      border-color: var(--accent-green);
    }

    .form-input.is-error {
      border-color: var(--accent-red);
      animation: inputShake 0.36s ease;
    }

    @keyframes inputShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .input-status-icon {
      position: absolute;
      right: 14px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .field-error-msg {
      font-size: 0.8rem;
      color: var(--accent-red);
      min-height: 18px;
    }

    .field-hint-msg {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* To'lov usullari kartalari */
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 560px) {
      .payment-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .payment-card {
      padding: 18px 14px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.2s ease;
    }

    .payment-card:hover {
      border-color: var(--border-gold);
      transform: translateY(-2px);
    }

    .payment-card.is-selected {
      border-color: var(--accent-gold);
      background: rgba(242, 169, 0, 0.12);
      box-shadow: var(--shadow-glow-gold);
    }

    /* Haqiqiy karta o'tkazmasi bloki va chek yuklash */
    .bank-card-box {
      margin-top: 18px;
      padding: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(242, 169, 0, 0.14), rgba(0, 229, 255, 0.08));
      border: 1px solid var(--border-gold-strong);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bank-card-number-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-gold);
    }

    .bank-card-digits {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
    }

    .copy-mini-btn {
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(242, 169, 0, 0.18);
      color: var(--accent-gold);
      border: 1px solid var(--border-gold);
      transition: background-color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .copy-mini-btn:hover {
      background: var(--accent-gold);
      color: #0b0d12;
    }

    .copy-mini-btn:active {
      transform: scale(0.96);
    }

    .pay-apps-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pay-app-link {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .pay-app-link:hover {
      border-color: var(--border-gold-strong);
      transform: translateY(-1px);
    }

    .receipt-upload-zone {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px dashed var(--border-gold);
      background: var(--bg-input);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .receipt-preview-img {
      max-height: 160px;
      width: auto;
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border-gold);
      object-fit: contain;
      align-self: flex-start;
    }

    .confirm-check-row {
      margin-top: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      font-size: 0.88rem;
    }

    .confirm-check-row.is-error {
      border-color: var(--accent-red);
      animation: inputShake 0.36s ease;
    }

    .confirm-check-row input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent-gold);
      flex-shrink: 0;
    }

    .summary-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 960px) {
      .summary-card {
        position: sticky;
        top: calc(var(--header-height) + 20px);
      }
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .summary-row strong {
      color: var(--text-primary);
    }

    .summary-total {
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .summary-total-price {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    /* Muvaffaqiyat holati va SVG galochka chizilishi */
    .order-success-box {
      padding: 36px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .success-check-svg {
      width: 84px;
      height: 84px;
    }

    .success-circle-path {
      stroke: var(--accent-green);
      stroke-width: 3;
      fill: rgba(16, 185, 129, 0.12);
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: drawStroke 0.65s ease forwards;
    }

    .success-tick-path {
      stroke: var(--accent-green);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawStroke 0.45s 0.4s ease forwards;
    }

    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }

    /* Konfetti va oltin tangalar yomg'iri kanvasi */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9600;
    }

    /* ==========================================================================
       14. BUYURTMANI KUZATISH (#/track) — VERTIKAL TIMELINE
       ========================================================================== */
    .track-card {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .track-search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .track-search-row .form-input {
      flex: 1;
      min-width: 210px;
      padding-right: 16px;
    }

    .timeline-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-top: 28px;
      padding-left: 10px;
    }

    .timeline-step {
      position: relative;
      display: flex;
      gap: 18px;
      padding-bottom: 30px;
    }

    .timeline-step:last-child {
      padding-bottom: 0;
    }

    .timeline-rail {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .timeline-node {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 2px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .timeline-line {
      width: 3px;
      flex: 1;
      background: var(--border-subtle);
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }

    .timeline-line-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--accent-green);
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 0.65s var(--ease-out-expo);
    }

    .timeline-step.is-done .timeline-node {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #0b0d12;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.45);
    }

    .timeline-step.is-done .timeline-line-fill {
      transform: scaleY(1);
    }

    .timeline-step.is-current .timeline-node {
      border-color: var(--accent-gold);
      background: rgba(242, 169, 0, 0.2);
      color: var(--accent-gold);
      animation: nodePulse 1.6s ease-in-out infinite;
    }

    @keyframes nodePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(242, 169, 0, 0.55); }
      50% { box-shadow: 0 0 0 10px rgba(242, 169, 0, 0); }
    }

    .timeline-body {
      padding-top: 4px;
    }

    .timeline-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
    }

    .timeline-sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* ==========================================================================
       15. BIZ HAQIMIZDA (#/about) VA QANDAY SOTIB OLINADI
       ========================================================================== */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 900px) {
      .about-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .story-timeline {
      position: relative;
      padding-left: 26px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .story-timeline-line {
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border-subtle);
      overflow: hidden;
    }

    .story-timeline-line-active {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--accent-gold), var(--accent-cyan));
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 1.1s var(--ease-out-expo);
    }

    .story-timeline.is-visible .story-timeline-line-active {
      transform: scaleY(1);
    }

    .story-item {
      position: relative;
    }

    .story-dot {
      position: absolute;
      left: -26px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 3px solid var(--accent-gold);
    }

    .how-steps-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 28px;
    }

    @media (min-width: 640px) {
      .how-steps-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .how-steps-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .how-step-card {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s var(--ease-out-expo);
    }

    .how-step-card.is-lit {
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
    }

    .how-step-num {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
      color: #0b0d12;
      font-family: var(--font-display);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       16. FAQ (#/faq) — AKKORDION VA JONLI QIDIRUV
       ========================================================================== */
    .faq-shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .faq-item {
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px solid var(--border-gold);
      overflow: hidden;
      transition: border-color 0.25s ease;
    }

    .faq-item.is-open {
      border-color: var(--border-gold-strong);
    }

    .faq-trigger {
      width: 100%;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
      font-weight: 600;
      font-size: 1rem;
    }

    .faq-plus {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(242, 169, 0, 0.14);
      color: var(--accent-gold);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      line-height: 1;
      flex-shrink: 0;
      transition: transform 0.3s var(--ease-out-expo), background-color 0.25s ease;
    }

    .faq-item.is-open .faq-plus {
      transform: rotate(45deg);
      background: var(--accent-gold);
      color: #0b0d12;
    }

    .faq-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.32s var(--ease-out-expo);
    }

    .faq-item.is-open .faq-content {
      grid-template-rows: 1fr;
    }

    .faq-content-inner {
      overflow: hidden;
    }

    .faq-answer {
      padding: 0 20px 18px;
      color: var(--text-secondary);
      font-size: 0.94rem;
      line-height: 1.65;
    }

    /* ==========================================================================
       17. ALOQA SAHIFASI (#/contact) — ONLAYN NUQTA VA FORMA
       ========================================================================== */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 900px) {
      .contact-grid {
        grid-template-columns: 0.9fr 1.1fr;
      }
    }

    .contact-cards-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-card {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .contact-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold);
    }

    .online-status-bar {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .online-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--accent-green);
      font-size: 0.9rem;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: onlineBlink 1.5s ease-in-out infinite;
    }

    @keyframes onlineBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    /* ==========================================================================
       18. TOAST XABARI, YUQORIGA RAKETA TUGMASI VA FOOTER
       ========================================================================== */
    .toast-box {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 9000;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-gold-strong);
      box-shadow: var(--shadow-glow-gold), 0 14px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 340px;
      transform: translateY(130%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.45s var(--ease-out-expo), opacity 0.35s ease;
    }

    .toast-box.is-visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    .scroll-top-btn {
      position: fixed;
      right: 20px;
      bottom: 84px;
      z-index: 700;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
      color: #0b0d12;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow-gold);
      opacity: 0;
      transform: translateY(20px) scale(0.85);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s var(--ease-out-expo);
    }

    .scroll-top-btn.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .scroll-top-btn:hover svg {
      animation: rocketBounce 0.55s ease infinite alternate;
    }

    @keyframes rocketBounce {
      from { transform: translateY(1px); }
      to { transform: translateY(-4px); }
    }

    /* ==========================================================================
       BUYURTMANI SERVER / TELEGRAM BOT API GA YUBORISH UCHUN TAYYOR FUNKSIYA
       ========================================================================== */
    async function sendOrder(orderData) {
      const { botToken, chatId } = CONFIG.telegramBot;
      const text = [
        `🛒 Yangi UC buyurtma: ${orderData.orderId}`,
        `🎮 Player ID: ${orderData.playerId}`,
        `💎 Miqdor: ${orderData.totalUc} UC`,
        `💰 Summa: ${orderData.totalPrice} so'm`,
        `💳 Karta: ${orderData.targetCard}`,
        `📱 Usul: ${orderData.paymentMethod}`,
        `📞 Aloqa: ${orderData.contact}`
      ].join("\n");

      // Agar CONFIG.telegramBot ichida botToken va chatId kiritilgan bo'lsa,
      // buyurtma va chek rasmi haqiqiy Telegram Bot API orqali yuboriladi.
      if (botToken && chatId) {
        try {
          if (orderData.receiptFile) {
            const fd = new FormData();
            fd.append("chat_id", chatId);
            fd.append("photo", orderData.receiptFile);
            fd.append("caption", text);
            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: "POST", body: fd });
          } else {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: chatId, text })
            });
          }
        } catch (err) {
          console.error("Telegram API xatosi:", err);
        }
      }
      return Promise.resolve({ ok: true, orderData });
    }

      const isLight = state.theme === "light";
      document.documentElement.classList.toggle("light", isLight);
      const sun = document.getElementById("theme-icon-sun");
      const moon = document.getElementById("theme-icon-moon");
      if (sun && moon) {
        sun.style.display = isLight ? "block" : "none";
        moon.style.display = isLight ? "none" : "block";
      }
      localStorage.setItem(STORAGE_KEYS.theme, state.theme);
    }

      state.lang = lang;
      localStorage.setItem(STORAGE_KEYS.lang, lang);
      document.documentElement.lang = lang;
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.lang === lang);

      renderNavigation();
      renderFooter();
      renderCartDrawer();
      renderCurrentPage(false);
    }

    /* ==========================================================================
       SAVAT FUNKSIYALARI VA UCHUVCHI TANGA ANIMATSIYASI
       ========================================================================== */
    function saveCart() {
      localStorage.setItem(STORAGE_KEYS.cart, JSON.stringify(state.cart));
      updateCartBadge(false);
    }

    function updateCartBadge(bounce = true) {
      const badge = document.getElementById("cart-badge");
      const totalItems = state.cart.reduce((sum, item) => sum + item.qty, 0);
      badge.textContent = totalItems;
      if (bounce) {
        badge.classList.remove("is-bouncing");
        void badge.offsetWidth;
        badge.classList.add("is-bouncing");
      }
    }

    function addToCart(pkgIndex, sourceEl) {
      const pkg = CONFIG.packages[pkgIndex];
      const existing = state.cart.find((item) => item.pkgIndex === pkgIndex);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ pkgIndex, qty: 1 });
      }
      state.selectedPkgIndex = pkgIndex;
      saveCart();
      updateCartBadge(true);
      renderCartDrawer();

      if (sourceEl) {
        flyCoinToCart(sourceEl);
      }
      showToast(`${pkg.uc + pkg.bonus} UC ${t().addedToast}`);
    }

    function flyCoinToCart(sourceEl) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const cartBtn = document.getElementById("cart-open-btn");
      if (!cartBtn) return;

      const startRect = sourceEl.getBoundingClientRect();
      const endRect = cartBtn.getBoundingClientRect();

      const flyer = document.createElement("div");
      flyer.className = "flying-coin";
      flyer.innerHTML = renderCoinSvg(34, "fly");
      flyer.style.left = `${startRect.left + startRect.width / 2 - 17}px`;
      flyer.style.top = `${startRect.top + startRect.height / 2 - 17}px`;
      document.body.appendChild(flyer);

      requestAnimationFrame(() => {
        const dx = endRect.left + endRect.width / 2 - (startRect.left + startRect.width / 2);
        const dy = endRect.top + endRect.height / 2 - (startRect.top + startRect.height / 2);
        flyer.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.45) rotate(360deg)`;
        flyer.style.opacity = "0.2";
      });

      setTimeout(() => flyer.remove(), 680);
    }

    function renderCartDrawer() {
      const c = t().cart;
      document.getElementById("cart-drawer-title").textContent = c.title;
      const body = document.getElementById("cart-drawer-body");
      const foot = document.getElementById("cart-drawer-foot");

      if (!state.cart.length) {
        body.innerHTML = `
          <div class="cart-empty">
            ${renderCoinSvg(64, "empty")}
            <strong style="color:var(--text-primary);font-size:1.05rem;">${c.emptyTitle}</strong>
            <span style="font-size:0.9rem;">${c.emptySub}</span>
            <button type="button" class="btn btn-primary" id="cart-go-shop-btn">${c.goShop}</button>
          </div>
        `;
        foot.innerHTML = "";
        document.getElementById("cart-go-shop-btn")?.addEventListener("click", () => {
          closeDrawers();
          navigateTo("shop");
        });
        return;
      }

      let subtotal = 0;
      let totalUc = 0;

      body.innerHTML = state.cart.map((item) => {
        const pkg = CONFIG.packages[item.pkgIndex];
        const pkgTotalUc = (pkg.uc + pkg.bonus) * item.qty;
        const pkgPrice = pkg.price * item.qty;
        subtotal += pkgPrice;
        totalUc += pkgTotalUc;

        return `
          <div class="cart-item">
            <div style="display:flex;align-items:center;gap:10px;">
              ${renderCoinSvg(38, "c" + item.pkgIndex)}
              <div class="cart-item-info">
                <span class="cart-item-title tabular">${formatNum(pkg.uc)} UC ${pkg.bonus ? `+ ${pkg.bonus}` : ""}</span>
                <span class="cart-item-price tabular">${formatPrice(pkgPrice)}</span>
              </div>
            </div>
            <div class="qty-controls">
              <button type="button" class="qty-btn" data-cart-dec="${item.pkgIndex}" aria-label="Kamaytirish">−</button>
              <span class="tabular" style="min-width:20px;text-align:center;font-weight:700;font-size:0.9rem;">${item.qty}</span>
              <button type="button" class="qty-btn" data-cart-inc="${item.pkgIndex}" aria-label="Ko'paytirish">+</button>
            </div>
          </div>
        `;
      }).join("");

      foot.innerHTML = `
        <div class="cart-total-row">
          <span style="color:var(--text-secondary);font-size:0.9rem;">${c.totalUc}</span>
          <strong class="tabular" style="color:var(--accent-cyan);">${formatNum(totalUc)} UC</strong>
        </div>
        <div class="cart-total-row">
          <span>${c.subtotal}</span>
          <span class="cart-total-val tabular">${formatPrice(subtotal)}</span>
        </div>
        <button type="button" class="btn btn-primary" id="cart-checkout-btn" style="width:100%;">${c.checkout}</button>
      `;

      body.querySelectorAll("[data-cart-inc]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.cartInc);
          const found = state.cart.find((x) => x.pkgIndex === idx);
          if (found) found.qty += 1;
          saveCart();
          renderCartDrawer();
        });
      });

      body.querySelectorAll("[data-cart-dec]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.cartDec);
          const foundIdx = state.cart.findIndex((x) => x.pkgIndex === idx);
          if (foundIdx > -1) {
            state.cart[foundIdx].qty -= 1;
            if (state.cart[foundIdx].qty <= 0) state.cart.splice(foundIdx, 1);
          }
          saveCart();
          renderCartDrawer();
        });
      });

      document.getElementById("cart-checkout-btn")?.addEventListener("click", () => {
        if (state.cart.length) {
          state.selectedPkgIndex = state.cart[0].pkgIndex;
          state.orderQty = state.cart[0].qty;
        }
        state.orderStep = 2;
        state.orderCompletedId = null;
        closeDrawers();
        navigateTo("order");
      });
    }

    function openDrawer(type) {
      document.getElementById("drawer-backdrop").classList.add("is-open");
      if (type === "cart") {
        document.getElementById("cart-drawer").classList.add("is-open");
      } else {
        document.getElementById("mobile-drawer").classList.add("is-open");
      }

    function closeDrawers() {
      document.getElementById("drawer-backdrop").classList.remove("is-open");
      document.getElementById("cart-drawer").classList.remove("is-open");
      document.getElementById("mobile-drawer").classList.remove("is-open");

    /* ==========================================================================
       TOAST XABARNOMASI VA TUGMA RIPPLE EFFEKTI
       ========================================================================== */
    let toastTimer = null;
    function showToast(message) {
      const box = document.getElementById("toast-box");
      document.getElementById("toast-icon").innerHTML = renderCoinSvg(28, "toast");
      document.getElementById("toast-text").textContent = message;
      box.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove("is-visible");
      }, 3000);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn");
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const span = document.createElement("span");
      const size = Math.max(rect.width, rect.height);
      span.className = "ripple-span";
      span.style.width = span.style.height = `${size}px`;
      span.style.left = `${e.clientX - rect.left - size / 2}px`;
      span.style.top = `${e.clientY - rect.top - size / 2}px`;
      btn.appendChild(span);
      setTimeout(() => span.remove(), 560);
    });

    /* ==========================================================================
       COUNTER ANIMATSIYASI (0 DAN RAQAMGA SANASH)
       ========================================================================== */
    function animateCounter(el, target, suffix = "", duration = 1200) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.textContent = formatNum(target) + suffix;
        return;
      }
      const start = performance.now();
      function frame(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(eased * target);
        el.textContent = formatNum(current) + suffix;
        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          el.textContent = formatNum(target) + suffix;
        }
      }
      requestAnimationFrame(frame);
    }

      if (state.shopSort === "asc") {
        list.sort((a, b) => a.pkg.price - b.pkg.price);
      } else if (state.shopSort === "desc") {
        list.sort((a, b) => b.pkg.price - a.pkg.price);
      }
      return list;
    }

    // FLIP (First, Last, Invert, Play) animatsiyasi saralashda kartalarni silliq ko'chiradi
    function sortShopWithFlip(newSort) {
      if (state.shopSort === newSort) return;
      const grid = document.getElementById("shop-grid");
      if (!grid) return;

      const oldPositions = new Map();
      grid.querySelectorAll(".uc-card").forEach((card) => {
        oldPositions.set(card.dataset.pkgIdx, card.getBoundingClientRect());
      });

      state.shopSort = newSort;
      document.querySelectorAll("[data-sort]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.sort === newSort);
      });

      const items = getSortedPackagesWithIndex();
      items.forEach((item) => {
        const card = grid.querySelector(`[data-pkg-idx="${item.idx}"]`);
        if (card) grid.appendChild(card);
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      grid.querySelectorAll(".uc-card").forEach((card) => {
        const prev = oldPositions.get(card.dataset.pkgIdx);
        const next = card.getBoundingClientRect();
        if (!prev) return;
        const dx = prev.left - next.left;
        const dy = prev.top - next.top;
        if (dx || dy) {
          card.style.transition = "none";
          card.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
          requestAnimationFrame(() => {

    function isPlayerIdValid(val) {
      return /^\d{8,12}$/.test(val.trim());
    }

    function isContactValid(val, mode) {
      const clean = val.trim();
      if (mode === "phone") {
        return /^\+998 \d{2} \d{3} \d{2} \d{2}$/.test(clean);
      }
      return /^@[a-zA-Z0-9_]{3,32}$/.test(clean);
    }

    // +998 XX XXX XX XX maskasi
    function applyPhoneMask(raw) {
      let digits = raw.replace(/\D/g, "");
      if (digits.startsWith("998")) digits = digits.slice(3);
      digits = digits.slice(0, 9);
      let out = "+998";
      if (digits.length > 0) out += " " + digits.slice(0, 2);
      if (digits.length > 2) out += " " + digits.slice(2, 5);
      if (digits.length > 5) out += " " + digits.slice(5, 7);
      if (digits.length > 7) out += " " + digits.slice(7, 9);
      return out;
    }
