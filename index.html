    // Konfetti va oltin tangalar yomg'iri effekti
    function launchConfetti() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#f2a900", "#ffd24a", "#00e5ff", "#10b981", "#ffffff"];
      const pieces = Array.from({ length: 95 }).map(() => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        r: 5 + Math.random() * 6,
        vx: (Math.random() - 0.5) * 4.5,
        vy: 3.5 + Math.random() * 4.5,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 10,
        color: colors[Math.floor(Math.random() * colors.length)],
        isCoin: Math.random() > 0.55
      }));

      let frames = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          if (p.isCoin) {
            ctx.beginPath();
            ctx.arc(0, 0, p.r, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
          }
          ctx.restore();
        });
        frames += 1;
        if (frames < 155) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(draw);
    }

    /* ==========================================================================
       SAHIFA 6: SAVOL-JAVOB (#/faq) — JONLI QIDIRUV VA AKKORDION
       ========================================================================== */
    function renderFaqPage() {
      const f = t().faq;
      return `
        <section class="section-block">
          <div class="container faq-shell">
            <div class="section-header">
              <h1 class="section-title">${f.title}</h1>
              <p class="section-subtitle">${f.sub}</p>
            </div>

            <div class="input-wrap">
              <input id="faq-search-input" type="search" class="form-input" placeholder="${f.searchPh}" value="${state.faqQuery}" />
              <span class="input-status-icon" style="color:var(--text-secondary);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </span>
            </div>

            <div class="faq-list" id="faq-list">
              ${buildFaqItemsHtml()}
            </div>
          </div>
        </section>
      `;
    }

    function buildFaqItemsHtml() {
      const f = t().faq;
      const q = state.faqQuery.trim().toLowerCase();
      const filtered = f.items
        .map((item, idx) => ({ ...item, idx }))
        .filter((item) => item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q));

      if (!filtered.length) {
        return `<div class="glass-card" style="padding:28px;text-align:center;color:var(--text-secondary);">${f.empty}</div>`;
      }

      return filtered.map((item) => `
        <div class="faq-item ${state.faqOpenIndex === item.idx ? "is-open" : ""}" data-faq-idx="${item.idx}">
          <button type="button" class="faq-trigger" aria-expanded="${state.faqOpenIndex === item.idx}">
            <span>${item.q}</span>
            <span class="faq-plus">+</span>
          </button>
          <div class="faq-content">
            <div class="faq-content-inner">
              <div class="faq-answer">${item.a}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    /* ==========================================================================
       HASH ROUTER VA SAHIFA HODISALARINI ULASH
       ========================================================================== */
    const VALID_ROUTES = ["home", "shop", "order", "track", "about", "faq", "contact"];

    function getRouteFromHash() {
      const clean = location.hash.replace(/^#\/?/, "").split("?")[0].trim().toLowerCase();
      return VALID_ROUTES.includes(clean) ? clean : "home";
    }

    function navigateTo(route) {
      if (location.hash === `#/${route}`) {
        renderCurrentPage(true);
      } else {
        location.hash = `#/${route}`;
      }
    }

    function renderCurrentPage(animateTransition = true) {
      const main = document.getElementById("app-main");
      clearInterval(state.reviewTimer);

      const paint = () => {
        let html = "";
        switch (state.route) {
          case "shop": html = renderShopPage(); break;
          case "order": html = renderOrderPage(); break;
          case "track": html = renderTrackPage(); break;
          case "about": html = renderAboutPage(); break;
          case "faq": html = renderFaqPage(); break;
          case "contact": html = renderContactPage(); break;
          default: html = renderHomePage();
        }
        main.innerHTML = `<div class="page-view ${animateTransition ? "is-entering" : ""}">${html}</div>`;
        bindPageEvents();
        setupScrollObservers();
        if (state.route === "home" && !document.body.classList.contains("is-loading")) {
          triggerHeroCounters();
        }
      };

      if (animateTransition && main.firstElementChild) {
        main.firstElementChild.classList.add("is-leaving");
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: "auto" });
          paint();
        }, 180);
      } else {
        paint();
      }
    }

    function triggerHeroCounters() {
      document.querySelectorAll(".hero-counter").forEach((el) => {
        if (el.dataset.counted) return;
        el.dataset.counted = "1";
        animateCounter(el, Number(el.dataset.target), el.dataset.suffix || "", 1250);
      });
    }

    /* ==========================================================================
       SAHIFA ICHKI HODISALARI (3D TILT, PARALLAX, FORMA VALIDATSIYA, SLIDER)
       ========================================================================== */
    function bindPageEvents() {
      // "Sotib olish" tugmalari (Bosh sahifa va Do'kon)
      document.querySelectorAll("[data-buy-idx]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const idx = Number(btn.dataset.buyIdx);
          addToCart(idx, btn);
        });
      });

      // Do'kon kartalarida sichqoncha yo'nalishiga qarab 3D tilt effekti
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && window.matchMedia("(hover: hover)").matches) {
        document.querySelectorAll(".uc-card").forEach((card) => {
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            card.style.transform = `perspective(700px) rotateX(${(-y * 10).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg) translateY(-4px)`;
          });
          card.addEventListener("mouseleave", () => {
            card.style.transform = "";
          });
        });
      }

      // Do'kon saralash tugmalari (FLIP animatsiyasi bilan)
      document.querySelectorAll("[data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => sortShopWithFlip(btn.dataset.sort));
      });

      // Bosh sahifa: Hero kursor parallax va Mijozlar fikrlari slideri
      if (state.route === "home") {
        const hero = document.getElementById("hero-section");
        if (hero && window.matchMedia("(hover: hover)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          hero.addEventListener("mousemove", (e) => {
            const nx = e.clientX / window.innerWidth - 0.5;
            const ny = e.clientY / window.innerHeight - 0.5;
            hero.querySelectorAll("[data-parallax]").forEach((el) => {
              const depth = Number(el.dataset.parallax);
              el.style.transform = `translate3d(${nx * depth}px, ${ny * depth}px, 0)`;
            });
          });
        }

        const updateSlider = (nextIdx) => {
          const total = t().reviews.length;
          state.reviewIndex = (nextIdx + total) % total;
          const track = document.getElementById("reviews-track");
          if (track) track.style.transform = `translateX(-${state.reviewIndex * 100}%)`;
          document.querySelectorAll("[data-rev-dot]").forEach((d, i) => {
            d.classList.toggle("is-active", i === state.reviewIndex);
          });
        };

        document.getElementById("rev-prev-btn")?.addEventListener("click", () => updateSlider(state.reviewIndex - 1));
        document.getElementById("rev-next-btn")?.addEventListener("click", () => updateSlider(state.reviewIndex + 1));
        document.querySelectorAll("[data-rev-dot]").forEach((dot) => {
          dot.addEventListener("click", () => updateSlider(Number(dot.dataset.revDot)));
        });

        state.reviewTimer = setInterval(() => updateSlider(state.reviewIndex + 1), 5000);
      }

      // Buyurtma sahifasi hodisalari
      if (state.route === "order") {
        document.querySelectorAll("[data-select-pkg]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.selectedPkgIndex = Number(btn.dataset.selectPkg);
            document.querySelectorAll("[data-select-pkg]").forEach((b) => b.classList.toggle("is-selected", Number(b.dataset.selectPkg) === state.selectedPkgIndex));
            animateSummaryNumbers();
          });
        });

        document.getElementById("order-qty-inc")?.addEventListener("click", () => {
          state.orderQty = Math.min(20, state.orderQty + 1);
          document.getElementById("order-qty-val").textContent = state.orderQty;
          animateSummaryNumbers();
        });

        document.getElementById("order-qty-dec")?.addEventListener("click", () => {
          state.orderQty = Math.max(1, state.orderQty - 1);
          document.getElementById("order-qty-val").textContent = state.orderQty;
          animateSummaryNumbers();
        });

        document.getElementById("order-step1-next")?.addEventListener("click", () => {
          state.orderStep = 2;
          renderCurrentPage(false);
        });

        document.getElementById("order-step2-prev")?.addEventListener("click", () => {
          state.orderStep = 1;
          renderCurrentPage(false);
        });

        // Player ID real-time validatsiya
        const pidInput = document.getElementById("inp-player-id");
        if (pidInput) {
          pidInput.addEventListener("input", () => {
            pidInput.value = pidInput.value.replace(/\D/g, "").slice(0, 12);
            state.playerId = pidInput.value;
            localStorage.setItem(STORAGE_KEYS.playerId, state.playerId);
            const ok = isPlayerIdValid(state.playerId);
            pidInput.classList.toggle("is-valid", ok);
            pidInput.classList.remove("is-error");
            document.getElementById("status-player-id").innerHTML = ok ? greenCheckSvg() : "";
            document.getElementById("err-player-id").textContent = "";
          });
        }

        // Telefon / Telegram rejimi va maskalash
        document.querySelectorAll("[data-cmode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.contactMode = btn.dataset.cmode;
            state.contactVal = state.contactMode === "phone" ? "+998 " : "@";
            localStorage.setItem(STORAGE_KEYS.contactMode, state.contactMode);
            localStorage.setItem(STORAGE_KEYS.contactVal, state.contactVal);
            renderCurrentPage(false);
          });
        });

        const contactInput = document.getElementById("inp-contact");
        if (contactInput) {
          contactInput.addEventListener("input", () => {
            if (state.contactMode === "phone") {
              contactInput.value = applyPhoneMask(contactInput.value);
            } else {
              if (!contactInput.value.startsWith("@")) {
                contactInput.value = "@" + contactInput.value.replace(/@/g, "");
              }
            }
            state.contactVal = contactInput.value;
            localStorage.setItem(STORAGE_KEYS.contactVal, state.contactVal);
            const ok = isContactValid(state.contactVal, state.contactMode);
            contactInput.classList.toggle("is-valid", ok);
            contactInput.classList.remove("is-error");
            document.getElementById("status-contact").innerHTML = ok ? greenCheckSvg() : "";
            document.getElementById("err-contact").textContent = "";
          });
        }

        document.getElementById("order-step2-next")?.addEventListener("click", () => {
          let hasErr = false;
          if (!isPlayerIdValid(state.playerId)) {
            hasErr = true;
            pidInput.classList.remove("is-error");
            void pidInput.offsetWidth;
            pidInput.classList.add("is-error");
            document.getElementById("err-player-id").textContent = t().order.playerIdErr;
          }
          if (!isContactValid(state.contactVal, state.contactMode)) {
            hasErr = true;
            contactInput.classList.remove("is-error");
            void contactInput.offsetWidth;
            contactInput.classList.add("is-error");
            document.getElementById("err-contact").textContent = state.contactMode === "phone" ? t().order.phoneErr : t().order.tgErr;
          }
          if (!hasErr) {
            state.orderStep = 3;
            renderCurrentPage(false);
          }
        });

        document.getElementById("order-step3-prev")?.addEventListener("click", () => {
          state.orderStep = 2;
          renderCurrentPage(false);
        });

        document.querySelectorAll("[data-pay-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.paymentMethod = btn.dataset.payId;
            renderCurrentPage(false);
          });
        });

        const copyToClipboard = async (text, msg) => {
          try {
            await navigator.clipboard.writeText(text);
          } catch (_) {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
          }
          showToast(msg);
        };

        document.getElementById("copy-card-btn")?.addEventListener("click", () => {
          copyToClipboard(CONFIG.paymentCard.rawNumber, t().order.copiedMsg);
        });

        document.getElementById("copy-amount-btn")?.addEventListener("click", () => {
          const pkg = CONFIG.packages[state.selectedPkgIndex];
          copyToClipboard(String(pkg.price * state.orderQty), t().order.copiedAmountMsg);
        });

        document.getElementById("inp-receipt-file")?.addEventListener("change", (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          state.receiptFile = file;
          const reader = new FileReader();
          reader.onload = () => {
            state.receiptPreviewUrl = String(reader.result || "");
            renderCurrentPage(false);
          };
          reader.readAsDataURL(file);
        });

        document.getElementById("remove-receipt-btn")?.addEventListener("click", () => {
          state.receiptFile = null;
          state.receiptPreviewUrl = "";
          renderCurrentPage(false);
        });

        const chkPay = document.getElementById("chk-pay-confirm");
        chkPay?.addEventListener("change", () => {
          state.paymentConfirmed = chkPay.checked;
          document.getElementById("confirm-pay-label")?.classList.remove("is-error");
          const errEl = document.getElementById("err-pay-confirm");
          if (errEl) errEl.textContent = "";
        });

        document.getElementById("order-submit-btn")?.addEventListener("click", async () => {
          if (!state.paymentConfirmed) {
            const lbl = document.getElementById("confirm-pay-label");
            lbl?.classList.remove("is-error");
            void lbl?.offsetWidth;
            lbl?.classList.add("is-error");
            document.getElementById("err-pay-confirm").textContent = t().order.confirmPayErr;
            return;
          }

          const pkg = CONFIG.packages[state.selectedPkgIndex];
          const randomNum = Math.floor(10000 + Math.random() * 89999);
          const orderId = `#UC-${randomNum}`;
          const payload = {
            orderId,
            packageUc: pkg.uc,
            bonusUc: pkg.bonus,
            qty: state.orderQty,
            totalUc: (pkg.uc + pkg.bonus) * state.orderQty,
            totalPrice: pkg.price * state.orderQty,
            playerId: state.playerId,
            contact: state.contactVal,
            paymentMethod: state.paymentMethod,
            targetCard: CONFIG.paymentCard.number,
            receiptFile: state.receiptFile,
            createdAt: new Date().toISOString()
          };

          await sendOrder(payload);

          const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders) || "[]");
          history.unshift({ ...payload, receiptFile: undefined });
          localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(history.slice(0, 10)));

          state.cart = [];
          saveCart();
          renderCartDrawer();
          state.lastOrderPayload = payload;
          state.paymentConfirmed = false;
          state.receiptFile = null;
          state.receiptPreviewUrl = "";
          state.orderCompletedId = orderId;
          state.trackOrderId = orderId;
          renderCurrentPage(false);
          launchConfetti();
        });

        document.getElementById("go-track-completed")?.addEventListener("click", () => {
          state.trackStage = 1;
          navigateTo("track");
          setTimeout(() => startTrackProgression(state.orderCompletedId, 1), 120);
        });

        document.getElementById("start-new-order")?.addEventListener("click", () => {
          state.orderCompletedId = null;
          state.orderStep = 1;
          renderCurrentPage(false);
        });
      }

      // Kuzatish sahifasi hodisalari
      if (state.route === "track") {
        const inp = document.getElementById("track-input");
        document.getElementById("track-check-btn")?.addEventListener("click", () => {
          const val = inp.value.trim().toUpperCase();
          if (!/^#?UC-\d{4,6}$/.test(val)) {
            inp.classList.remove("is-error");
            void inp.offsetWidth;
            inp.classList.add("is-error");
            document.getElementById("track-err").textContent = t().track.notFound;
            return;
          }
          const normalized = val.startsWith("#") ? val : "#" + val;
          const randomStage = Math.floor(Math.random() * 3);
          startTrackProgression(normalized, randomStage);
        });

        document.getElementById("track-demo-btn")?.addEventListener("click", () => {
          startTrackProgression("#UC-48291", 0);
        });

        document.querySelectorAll("[data-quick-track]").forEach((btn) => {
          btn.addEventListener("click", () => {
            startTrackProgression(btn.dataset.quickTrack, 1);
          });
        });
      }

      // FAQ sahifasi hodisalari
      if (state.route === "faq") {
        const searchInp = document.getElementById("faq-search-input");
        const bindFaqToggles = () => {
          document.querySelectorAll(".faq-trigger").forEach((trg) => {
            trg.addEventListener("click", () => {
              const parent = trg.closest(".faq-item");
              const idx = Number(parent.dataset.faqIdx);
              state.faqOpenIndex = state.faqOpenIndex === idx ? -1 : idx;
              document.querySelectorAll(".faq-item").forEach((el) => {
                const open = Number(el.dataset.faqIdx) === state.faqOpenIndex;
                el.classList.toggle("is-open", open);
                el.querySelector(".faq-trigger").setAttribute("aria-expanded", String(open));
              });
            });
          });
        };
        bindFaqToggles();

        searchInp?.addEventListener("input", () => {
          state.faqQuery = searchInp.value;
          document.getElementById("faq-list").innerHTML = buildFaqItemsHtml();
          bindFaqToggles();
        });
      }

      // Aloqa sahifasi formasi (SMS + Telegram yuborish)
      if (state.route === "contact") {
        const form = document.getElementById("contact-form");
        form?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("c-name");
          const contact = document.getElementById("c-contact");
          const msg = document.getElementById("c-msg");
          let valid = true;

          [name, contact, msg].forEach((el) => {
            if (!el.value.trim()) {
              valid = false;
              el.classList.remove("is-error");
              void el.offsetWidth;
              el.classList.add("is-error");
            } else {
              el.classList.remove("is-error");
              el.classList.add("is-valid");
            }
          });

          if (!valid) return;

          const smsBody = `UC Drop | Ism: ${name.value.trim()} | Aloqa: ${contact.value.trim()} | Xabar: ${msg.value.trim()}`;
          const encodedBody = encodeURIComponent(smsBody);
          const smsHref = `sms:${CONFIG.smsNumber}?body=${encodedBody}`;
          const tgHref = `${CONFIG.telegramUrl}?text=${encodedBody}`;

          // Agar backend SMS Gateway (masalan Eskiz.uz) ulangan bo'lsa avtomatik yuborish
          if (CONFIG.smsApi.endpoint) {
            try {
              await fetch(CONFIG.smsApi.endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  ...(CONFIG.smsApi.token ? { Authorization: `Bearer ${CONFIG.smsApi.token}` } : {})
                },
                body: JSON.stringify({ to: CONFIG.smsNumber, message: smsBody })
              });
            } catch (err) {
              console.error("SMS API xatosi:", err);
            }
          }

          // Qurilmaning SMS ilovasini to'g'ridan-to'g'ri +998930694509 raqamiga ochish
          const smsLink = document.createElement("a");
          smsLink.href = smsHref;
          document.body.appendChild(smsLink);
          smsLink.click();
          smsLink.remove();

          form.reset();
          [name, contact, msg].forEach((el) => el.classList.remove("is-valid"));
          document.getElementById("contact-feedback").innerHTML = `
            <div style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.4);">
              <div style="display:flex;align-items:center;gap:10px;color:var(--accent-green);font-weight:600;font-size:0.9rem;">
                ${greenCheckSvg()}
                <span>${t().contact.sentOk}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                <a href="${smsHref}" class="btn btn-primary" style="min-height:40px;padding:8px 14px;font-size:0.84rem;">${t().contact.smsSendNow}</a>
                <a href="${tgHref}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="min-height:40px;padding:8px 14px;font-size:0.84rem;">${t().contact.tgSendNow}</a>
              </div>
            </div>
          `;
        });
      }
    }

    /* ==========================================================================
       INTERSECTION OBSERVER (SCROLL'DA BLOKLAR VA RAQAMLARNI PAYDO QILISH)
       ========================================================================== */
    let activeObserver = null;
    function setupScrollObservers() {
      if (activeObserver) activeObserver.disconnect();

      const targets = document.querySelectorAll(".reveal-on-scroll, .scroll-counter, .how-step-card");
      if (!("IntersectionObserver" in window)) {
        targets.forEach((el) => el.classList.add("is-visible", "is-lit"));
        return;
      }

      activeObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          el.classList.add("is-visible");

          if (el.classList.contains("how-step-card")) {
            setTimeout(() => el.classList.add("is-lit"), Number(el.dataset.howStep || 0) * 140);
          }

          if (el.classList.contains("scroll-counter") && !el.dataset.counted) {
            el.dataset.counted = "1";
            animateCounter(el, Number(el.dataset.target), el.dataset.suffix || "", 1200);
          }
          activeObserver.unobserve(el);
        });
      }, { threshold: 0.14 });

      targets.forEach((el) => activeObserver.observe(el));
    }

    /* ==========================================================================
       FON ZARRALARI VA MAXSUS KURSOR ANIMATSIYASI
       ========================================================================== */
    function initParticles() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("particles-canvas");
      const ctx = canvas.getContext("2d");

      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener("resize", resize);

      const count = window.innerWidth < 768 ? 22 : 42;
      const dots = Array.from({ length: count }).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 1 + Math.random() * 1.8,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -0.15 - Math.random() * 0.35,
        gold: Math.random() > 0.28
      }));

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dots.forEach((d) => {
          d.x += d.vx;
          d.y += d.vy;
          if (d.y < -10) { d.y = canvas.height + 10; d.x = Math.random() * canvas.width; }
          if (d.x < -10) d.x = canvas.width + 10;
          if (d.x > canvas.width + 10) d.x = -10;

          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = d.gold ? "rgba(255, 210, 74, 0.45)" : "rgba(0, 229, 255, 0.35)";
          ctx.fill();
        });
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    function initCustomCursor() {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      document.body.classList.add("custom-cursor-active");
      const dot = document.getElementById("cursor-dot");
      const ring = document.getElementById("cursor-ring");

      let mx = -100, my = -100, rx = -100, ry = -100;
      let started = false;

      window.addEventListener("mousemove", (e) => {
        mx = e.clientX;
        my = e.clientY;
        if (!started) {
          started = true;
          dot.style.opacity = "1";
          ring.style.opacity = "1";
          rx = mx; ry = my;
        }
        dot.style.transform = `translate3d(${mx}px, ${my}px, 0)`;

        const interactive = e.target.closest("a, button, input, textarea, [role='button']");
        ring.classList.toggle("is-hover", Boolean(interactive));
      });

      function follow() {
        rx += (mx - rx) * 0.16;
        ry += (my - ry) * 0.16;
        ring.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
        requestAnimationFrame(follow);
      }
      requestAnimationFrame(follow);
    }

    /* ==========================================================================
       KIRISH YUKLASH EKRANI (1.9 SONIYA, 0% -> 100%, IKKIGA BO'LINIB OCHILISH)
       ========================================================================== */
    function runIntroLoader() {
      document.getElementById("loader-coin-slot").innerHTML = renderCoinSvg(72, "loader");
      const overlay = document.getElementById("loader-overlay");
      const statusEl = document.getElementById("loader-status-text");
      const barEl = document.getElementById("loader-bar-fill");

      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duration = reduced ? 300 : 1950;
      const start = performance.now();

      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const pct = Math.round(p * 100);
        statusEl.textContent = `${t().loading} ${pct}%`;
        barEl.style.width = `${pct}%`;

        if (p < 1) {
          requestAnimationFrame(tick);
        } else {
          overlay.classList.add("is-splitting");
          document.body.classList.remove("is-loading");
          setTimeout(() => {
            document.body.classList.add("hero-ready");
            if (state.route === "home") triggerHeroCounters();
          }, 180);

          setTimeout(() => {
            overlay.classList.add("is-done");
            overlay.style.display = "none";
            showToast(t().welcomeToast);
          }, 860);
        }
      }
      requestAnimationFrame(tick);
    }

    /* ==========================================================================
       ILOVANI ISHGA TUSHIRISH
       ========================================================================== */
    function bootstrap() {
      applyTheme();
      state.route = getRouteFromHash();
      if (!location.hash) {
        history.replaceState(null, "", "#/home");
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.lang === state.lang);
        btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
      });

      document.getElementById("theme-toggle-btn").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
      });

      document.getElementById("cart-open-btn").addEventListener("click", () => openDrawer("cart"));
      document.getElementById("cart-close-btn").addEventListener("click", closeDrawers);
      document.getElementById("mobile-menu-open").addEventListener("click", () => openDrawer("menu"));
      document.getElementById("mobile-menu-close").addEventListener("click", closeDrawers);
      document.getElementById("drawer-backdrop").addEventListener("click", closeDrawers);

      document.getElementById("mobile-nav-list").addEventListener("click", (e) => {
        if (e.target.closest(".mobile-nav-link")) closeDrawers();
      });

      window.addEventListener("hashchange", () => {
        state.route = getRouteFromHash();
        renderNavigation();
        renderCurrentPage(true);
      });

      // Scroll hodisalari: header blur, progress chizig'i, yuqoriga tugma
      const header = document.getElementById("site-header");
      const progressBar = document.getElementById("scroll-progress");
      const topBtn = document.getElementById("scroll-top-btn");

      window.addEventListener("scroll", () => {
        const y = window.scrollY;
        header.classList.toggle("is-scrolled", y > 14);
        topBtn.classList.toggle("is-visible", y > 320);

        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const pct = maxScroll > 0 ? (y / maxScroll) * 100 : 0;
        progressBar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      }, { passive: true });

      topBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      renderNavigation();
      renderFooter();
      updateCartBadge(false);
      renderCartDrawer();
      renderCurrentPage(false);

      initParticles();
      initCustomCursor();
      runIntroLoader();
    }

    document.addEventListener("DOMContentLoaded", bootstrap);
  </script>
